# Verifies that the ExoscaleMachine webhooks assign spec.machineID on creation and
# reject invalid spec changes on update.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: machine-webhook
spec:
  bindings:
    - name: machineName
      value: (join('-', ['machine-webhook', ($values.suffix || 'local')]))
    - name: namespace
      value: default

  steps:
    - name: apply machine
      try:
        - apply:
            file: exoscalemachine.yaml
            # Checked on the object the API server returns, so a machineID here was assigned by
            # the defaulting webhook at admission rather than by the controller on a later
            # reconciliation. The identity must live in the spec: it names and labels the
            # Exoscale instance, and `clusterctl move` never restores the status.
            expect:
              - match:
                  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
                  kind: ExoscaleMachine
                check:
                  (regex_match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', spec.machineID)): true

    - name: allow provider ID update
      try:
        # patch, not update: chainsaw's update replaces the whole object, so a payload that omits
        # spec.machineID reads as a removal and the validating webhook rejects it.
        - patch:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                template: Linux Ubuntu 24.04 LTS 64-bit
                instanceType: small
                providerID: exoscale://11111111-2222-3333-4444-555555555555
        - assert:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                providerID: exoscale://11111111-2222-3333-4444-555555555555

    - name: reject instance type update
      try:
        - patch:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                template: Linux Ubuntu 24.04 LTS 64-bit
                instanceType: medium
                providerID: exoscale://11111111-2222-3333-4444-555555555555
            expect:
              - match:
                  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
                  kind: ExoscaleMachine
                check:
                  ($error != null): true
                  (contains($error, 'instance creation fields are immutable')): true

    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              name: ($machineName)
              namespace: ($namespace)
