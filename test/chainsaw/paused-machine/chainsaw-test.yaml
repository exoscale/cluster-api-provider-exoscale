apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: paused-machine
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  bindings:
  - name: zone
    value: ($values.zone || 'bg-sof-1')
  - name: clusterName
    value: (join('-', ['exo-pm', ($values.suffix || 'local')]))
  - name: machineName
    value: (join('-', ['machine-paused', ($values.suffix || 'local')]))
  - name: namespace
    value: default
  steps:
    - name: apply paused cluster
      try:
        - apply:
            file: cluster.yaml

    - name: apply machine
      try:
        - apply:
            file: machine.yaml
        - script:
            timeout: 10s
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              kubectl get machine "$MACHINE_NAME" -n default -o jsonpath='{.metadata.uid}'
            outputs:
              - name: machineUID
                value: ($stdout)
        - apply:
            file: exoscalemachine.yaml

    - name: assert machine paused
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                (providerID == null): true
              status:
                conditions:
                  - type: Paused
                    reason: Paused
                    status: "True"
                (instanceID == null): true
