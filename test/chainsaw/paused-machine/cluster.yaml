apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleCluster
metadata:
  name: ($clusterName)
  namespace: ($namespace)
  annotations:
    cluster.x-k8s.io/paused: "true"
spec:
  zone: ($zone)
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ($clusterName)
  namespace: ($namespace)
spec:
  paused: true
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ExoscaleCluster
    name: ($clusterName)
