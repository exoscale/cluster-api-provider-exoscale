apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleClusterTemplate
metadata:
  name: ($templateName)
  namespace: ($namespace)
spec:
  template:
    spec:
      zone: bg-sof-1
      securityGroupControlPlane:
        rules:
          - description: allow ssh
            network: "0.0.0.0/0"
            endPort: 22
            startPort: 22
            protocol: tcp
            flowDirection: ingress
      securityGroupNode:
        rules:
          - description: allow ssh
            network: "0.0.0.0/0"
            endPort: 22
            startPort: 22
            protocol: tcp
            flowDirection: ingress
