# verifies the full real VM lifecycle:
# - create VM,
# - mark machine ready,
# - set providerID, then
# - delete VM.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deploy-machine
spec:
  concurrent: false
  timeouts:
    delete: 10m
    cleanup: 10m
  bindings:
    - name: zone
      value: ($values.zone || 'bg-sof-1')
    - name: clusterName
      value: (join('-', ['exo-dm', ($values.suffix || 'local')]))
    - name: machineName
      value: (join('-', ['machine', ($values.suffix || 'local')]))
    - name: namespace
      value: default
    - name: template
      value: ($values.template)
    - name: instanceType
      value: ($values.instanceType || 'small')
  steps:
    - name: apply cluster
      try:
        - apply:
            file: cluster.yaml

    - name: apply machine
      try:
        - apply:
            file: machine.yaml
            outputs:
              - name: machine
                match:
                  apiVersion: cluster.x-k8s.io/v1beta2
                  kind: Machine
                  metadata:
                    name: ($machineName)
                value: (@)
        - apply:
            file: kubeadmconfig.yaml
        - apply:
            file: exoscalemachine.yaml

    - name: assert requested machine inputs
      try:
        - assert:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                template: ($template)
                instanceType: ($instanceType)
                (sshKey == null): true

    - name: assert bootstrap data generated
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
              kind: KubeadmConfig
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              status:
                initialization:
                  dataSecretCreated: true
                (dataSecretName != ''): true
        - assert:
            timeout: 2m
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Machine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                bootstrap:
                  (dataSecretName != ''): true

    - name: assert machine ready
      try:
        - assert:
            timeout: 10m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              status:
                initialization:
                  provisioned: true
                ready: true
                instanceState: running
                (regex_match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', instanceID)): true
                (length(addresses[?type == 'ExternalIP'])): 1
        - assert:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              (spec.providerID == join('', ['exoscale://', status.instanceID])): true

    - name: assert capi machine registered infra machine
      try:
        - assert:
            timeout: 2m
            bindings:
              - name: infraMachine
                value: (x_k8s_get($client, 'infrastructure.cluster.x-k8s.io/v1alpha1', 'ExoscaleMachine', $namespace, $machineName))
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Machine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              (spec.providerID == $infraMachine.spec.providerID): true
              status:
                initialization:
                  infrastructureProvisioned: true
                addresses:
                  - type: ExternalIP
                    (address != ''): true

    - name: delete CAPI machine
      try:
        - delete:
            timeout: 10m
            ref:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Machine
              name: ($machineName)
              namespace: ($namespace)
