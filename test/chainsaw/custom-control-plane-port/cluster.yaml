apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleCluster
metadata:
  name: ($clusterName)
  namespace: ($namespace)
spec:
  zone: ($zone)
  controlPlaneEndpoint:
    port: ($apiServerPort)
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ($clusterName)
  namespace: ($namespace)
spec:
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ExoscaleCluster
    name: ($clusterName)
