apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleMachineTemplate
metadata:
  name: ($cpName)
  namespace: ($namespace)
spec:
  template:
    spec:
      template: ($template)
      instanceType: ($instanceType)
      rootVolumeSizeGiB: 50
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: K0sControlPlane
metadata:
  name: ($cpName)
  namespace: ($namespace)
spec:
  replicas: 1
  version: ($k0sVersion)
  k0sConfigSpec:
    args:
      - --enable-worker
    k0s:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: k0s
      spec:
        telemetry:
          enabled: false
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: ExoscaleMachineTemplate
      name: ($cpName)
