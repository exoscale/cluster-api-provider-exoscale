name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE: docker.io/exoscale/cluster-api-provider-exoscale-controller:${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate release assets
        run: |
          make build-installer IMG="$IMAGE"
          mv dist/install.yaml infrastructure-components.yaml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.38.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: make docker-buildx IMG="$IMAGE"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" infrastructure-components.yaml metadata.yaml --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}"
