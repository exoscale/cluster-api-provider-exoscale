apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deploy-machine
spec:
  timeouts:
    delete: 10m
    cleanup: 10m
  bindings:
  - name: zone
    value: ($values.zone || 'bg-sof-1')
  - name: clusterName
    value: (join('-', ['exo-dm', ($values.suffix || 'local')]))
  - name: machineName
    value: (join('-', ['machine', ($values.suffix || 'local')]))
  - name: bootstrapSecretName
    value: (join('-', ['bootstrap', ($values.suffix || 'local')]))
  - name: namespace
    value: default
  - name: templateID
    value: ($values.templateID)
  - name: sshKey
    value: ($values.sshKey)
  - name: instanceType
    value: ($values.instanceType || 'small')
  steps:
    - name: apply cluster
      try:
        - apply:
            file: cluster.yaml

    - name: apply machine
      try:
        - apply:
            file: machine.yaml
        - script:
            timeout: 10s
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              kubectl get machine "$MACHINE_NAME" -n default -o jsonpath='{.metadata.uid}'
            outputs:
              - name: machineUID
                value: ($stdout)
        - apply:
            file: exoscalemachine.yaml

    - name: assert machine ready
      try:
        - assert:
            timeout: 10m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              status:
                initialization:
                  provisioned: true
                ready: true
                instanceState: running
                (regex_match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', instanceID)): true
                (length(addresses[?type == 'ExternalIP'])): 1
        - script:
            timeout: 10s
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              instance_id=$(kubectl get exoscalemachine "$MACHINE_NAME" -n default -o jsonpath='{.status.instanceID}')
              provider_id=$(kubectl get exoscalemachine "$MACHINE_NAME" -n default -o jsonpath='{.spec.providerID}')
              test "$provider_id" = "exoscale://$instance_id"

    - name: assert capi machine registered infra machine
      try:
        - script:
            timeout: 2m
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              for _ in $(seq 1 60); do
                provider_id=$(kubectl get machine "$MACHINE_NAME" -n default -o jsonpath='{.spec.providerID}')
                provisioned=$(kubectl get machine "$MACHINE_NAME" -n default -o jsonpath='{.status.initialization.infrastructureProvisioned}')
                external_ip=$(kubectl get machine "$MACHINE_NAME" -n default -o jsonpath='{.status.addresses[?(@.type=="ExternalIP")].address}')
                case "$provider_id" in
                  exoscale://????????-????-????-????-????????????)
                    test "$provisioned" = "true" && test -n "$external_ip" && exit 0
                    ;;
                esac
                sleep 2
              done
              kubectl get machine "$MACHINE_NAME" -n default -o yaml
              exit 1

    - name: delete machine
      try:
        - script:
            timeout: 10m
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              kubectl delete exoscalemachine "$MACHINE_NAME" -n default --timeout=10m
              kubectl wait --for=delete exoscalemachine/"$MACHINE_NAME" -n default --timeout=10m
