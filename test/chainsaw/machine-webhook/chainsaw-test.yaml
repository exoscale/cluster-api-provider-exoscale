apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: machine-webhook
spec:
  bindings:
    - name: machineName
      value: (join('-', ['machine-webhook', ($values.suffix || 'local')]))
    - name: namespace
      value: default

  steps:
    - name: apply machine
      try:
        - apply:
            file: exoscalemachine.yaml

    - name: allow provider ID update
      try:
        - update:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                template: Linux Ubuntu 24.04 LTS 64-bit
                instanceType: small
                providerID: exoscale://11111111-2222-3333-4444-555555555555
        - assert:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                providerID: exoscale://11111111-2222-3333-4444-555555555555

    - name: reject instance type update
      try:
        - update:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                template: Linux Ubuntu 24.04 LTS 64-bit
                instanceType: medium
                providerID: exoscale://11111111-2222-3333-4444-555555555555
            expect:
              - match:
                  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
                  kind: ExoscaleMachine
                check:
                  ($error != null): true
                  (contains($error, 'instance creation fields are immutable')): true

    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              name: ($machineName)
              namespace: ($namespace)
