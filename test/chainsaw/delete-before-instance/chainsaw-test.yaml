apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: delete-before-instance
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  bindings:
  - name: zone
    value: ($values.zone || 'bg-sof-1')
  - name: clusterName
    value: (join('-', ['exo-dbi', ($values.suffix || 'local')]))
  - name: machineName
    value: (join('-', ['machine-delete-before-instance', ($values.suffix || 'local')]))
  - name: bootstrapSecretName
    value: (join('-', ['bootstrap-delete-before-instance', ($values.suffix || 'local')]))
  - name: namespace
    value: default
  steps:
    - name: apply cluster
      try:
        - apply:
            file: cluster.yaml

    - name: assert cluster paused
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              status:
                conditions:
                  - type: Paused
                    reason: Paused
                    status: "True"
                (securityGroupNode == null): true

    - name: apply invalid machine
      try:
        - apply:
            file: machine.yaml
        - script:
            timeout: 10s
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              kubectl get machine "$MACHINE_NAME" -n default -o jsonpath='{.metadata.uid}'
            outputs:
              - name: machineUID
                value: ($stdout)
        - apply:
            file: exoscalemachine.yaml

    - name: assert stopped before instance
      try:
        - script:
            timeout: 2m
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              for _ in $(seq 1 60); do
                finalizers=$(kubectl get exoscalemachine "$MACHINE_NAME" -n default -o jsonpath='{.metadata.finalizers[*]}')
                case " $finalizers " in
                  *" exoscalemachine.infrastructure.cluster.x-k8s.io "*) exit 0 ;;
                esac
                sleep 2
              done
              kubectl get exoscalemachine "$MACHINE_NAME" -n default -o yaml
              exit 1
        - script:
            timeout: 10s
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              instance_id=$(kubectl get exoscalemachine "$MACHINE_NAME" -n default -o jsonpath='{.status.instanceID}')
              provider_id=$(kubectl get exoscalemachine "$MACHINE_NAME" -n default -o jsonpath='{.spec.providerID}')
              ready=$(kubectl get exoscalemachine "$MACHINE_NAME" -n default -o jsonpath='{.status.ready}')
              test -z "$instance_id"
              test -z "$provider_id"
              test "$ready" != "true"

    - name: delete before instance exists
      try:
        - delete:
            timeout: 2m
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              namespace: ($namespace)
              name: ($machineName)
        - wait:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: ExoscaleMachine
            namespace: ($namespace)
            name: ($machineName)
            timeout: 2m
            for:
              deletion: {}
