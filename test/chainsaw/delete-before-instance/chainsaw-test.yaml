apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: delete-before-instance
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  bindings:
  - name: zone
    value: ($values.zone || 'bg-sof-1')
  - name: clusterName
    value: (join('-', ['exo-dbi', ($values.suffix || 'local')]))
  - name: machineName
    value: (join('-', ['machine-delete-before-instance', ($values.suffix || 'local')]))
  - name: bootstrapSecretName
    value: (join('-', ['bootstrap-delete-before-instance', ($values.suffix || 'local')]))
  - name: namespace
    value: default
  steps:
    - name: apply cluster
      try:
        - apply:
            file: cluster.yaml

    - name: apply machine before cluster infrastructure
      try:
        - apply:
            file: machine.yaml
        - script:
            timeout: 10s
            env:
              - name: MACHINE_NAME
                value: ($machineName)
            content: |
              kubectl get machine "$MACHINE_NAME" -n default -o jsonpath='{.metadata.uid}'
            outputs:
              - name: machineUID
                value: ($stdout)
        - apply:
            file: exoscalemachine.yaml

    - name: assert stopped before instance
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
                finalizers:
                  - exoscalemachine.infrastructure.cluster.x-k8s.io
              spec:
                (providerID == null): true
              (status.instanceID == null): true

    - name: delete before instance exists
      try:
        - delete:
            timeout: 2m
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              namespace: ($namespace)
              name: ($machineName)
        - wait:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
            kind: ExoscaleMachine
            namespace: ($namespace)
            name: ($machineName)
            timeout: 2m
            for:
              deletion: {}
