apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleMachineTemplate
metadata:
  name: my-k0s-cluster-cp
  namespace: default
spec:
  template:
    spec:
      template: "Linux Ubuntu 24.04 LTS 64-bit"
      instanceType: standard.medium
      rootVolumeSizeGiB: 50
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: K0sControlPlane
metadata:
  name: my-k0s-cluster-cp
  namespace: default
spec:
  replicas: 1
  version: v1.34.10+k0s.0
  k0sConfigSpec:
    args:
      - --enable-worker
      # k0s defaults the kubelet root dir to /var/lib/k0s/kubelet, but the
      # Exoscale CSI driver's node plugin looks for the kubelet plugin
      # registration/socket directory at the standard /var/lib/kubelet.
      # Move it there so the driver finds it.
      - --kubelet-root-dir=/var/lib/kubelet
      # The CSI driver needs to know which Exoscale instance/zone it runs
      # on. Setting these labels at node registration lets it read that
      # straight off the Node object instead of falling back to the
      # cloud-init config drive or the Exoscale metadata server.
      - --labels=topology.kubernetes.io/zone=ch-gva-2,topology.kubernetes.io/region=ch-gva-2
    k0s:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: k0s
      spec:
        telemetry:
          enabled: false
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: ExoscaleMachineTemplate
      name: my-k0s-cluster-cp
