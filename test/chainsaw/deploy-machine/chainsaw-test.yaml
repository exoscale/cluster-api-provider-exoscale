# Verifies bootstrap generation and the full real VM lifecycle, including
# readiness, addresses, providerID propagation to CAPI, and VM deletion.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deploy-machine
spec:
  timeouts:
    delete: 10m
    cleanup: 10m
  bindings:
    - name: zone
      value: ($values.zone || 'bg-sof-1')
    - name: clusterName
      value: (join('-', ['exo-dm', ($values.suffix || 'local')]))
    - name: namespace
      value: default
    - name: template
      value: ($values.template)
    - name: instanceType
      value: ($values.instanceType || 'small')
  steps:
    - name: apply cluster
      try:
        - apply:
            file: cluster.yaml

    - name: apply control plane
      try:
        - apply:
            file: controlplane.yaml

    - name: assert requested machine inputs
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
              spec:
                template: ($template)
                instanceType: ($instanceType)
                (sshKey == null): true

    - name: assert bootstrap data generated
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
              kind: KubeadmConfig
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
              status:
                initialization:
                  dataSecretCreated: true
                (dataSecretName != ''): true
        - assert:
            timeout: 2m
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Machine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
                  cluster.x-k8s.io/control-plane: ""
              spec:
                bootstrap:
                  (dataSecretName != ''): true

    - name: assert machine ready
      try:
        - assert:
            timeout: 10m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
              status:
                initialization:
                  provisioned: true
                ready: true
                conditions:
                  - type: Ready
                    reason: Ready
                    status: "True"
                addresses:
                  - type: ExternalIP
                    (address != ''): true
        - assert:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
              (spec.providerID == join('', ['exoscale://', status.instanceID])): true
              status:
                (regex_match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', instanceID)): true

    - name: assert capi machine registered infra machine
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Machine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
                  cluster.x-k8s.io/control-plane: ""
              (spec.providerID != ''): true
              status:
                initialization:
                  infrastructureProvisioned: true
                addresses:
                  - type: ExternalIP
                    (address != ''): true

    - name: delete cluster
      try:
        - delete:
            timeout: 10m
            ref:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Cluster
              name: ($clusterName)
              namespace: ($namespace)
