# Verifies that a machine remains unprovisioned while its cluster is paused and
# resumes reconciliation when the cluster is unpaused.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: paused-machine
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  bindings:
    - name: zone
      value: ($values.zone || 'bg-sof-1')
    - name: clusterName
      value: (join('-', ['exo-pm', ($values.suffix || 'local')]))
    - name: machineName
      value: (join('-', ['machine-paused', ($values.suffix || 'local')]))
    - name: namespace
      value: default
  steps:
    - name: apply paused cluster
      try:
        - apply:
            file: cluster.yaml

    - name: apply machine
      try:
        - apply:
            file: exoscalemachine.yaml

    - name: assert machine paused
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                (providerID == null): true
              status:
                conditions:
                  - type: Paused
                    reason: Paused
                    status: "True"
                (instanceID == null): true

    - name: assert cluster transition reconciles machine
      try:
        - sleep:
            duration: 3s
        - patch:
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Cluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              spec:
                paused: false
        - sleep:
            duration: 3s
        - assert:
            timeout: 1m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
              spec:
                (providerID == null): true
              status:
                conditions:
                  - type: Ready
                    reason: NotReady
                    status: "False"
                (instanceID == null): true

    - name: delete cluster
      try:
        # The ExoscaleMachine is only labelled with the cluster name, not owned by
        # a Machine, so deleting the Cluster does not garbage-collect it.
        - delete:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              name: ($machineName)
              namespace: ($namespace)
        - delete:
            timeout: 10m
            ref:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Cluster
              name: ($clusterName)
              namespace: ($namespace)
