apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: custom-control-plane-port
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  bindings:
  - name: zone
    value: ($values.zone || 'bg-sof-1')
  - name: clusterName
    value: (join('-', ['exo-port', ($values.suffix || 'local')]))
  - name: namespace
    value: default
  - name: apiServerPort
    value: 7443
  steps:
    - name: apply resources
      try:
        - apply:
            file: cluster.yaml

    - name: assert custom endpoint
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              spec:
                controlPlaneEndpoint:
                  port: ($apiServerPort)
              status:
                initialization:
                  provisioned: true
                controlPlaneEndpoint:
                  (regex_match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', id)): true
                  (regex_match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$', host)): true
                  port: ($apiServerPort)
                conditions:
                  - type: Ready
                    reason: ReconcileSuccess
                    status: "True"
        - script:
            timeout: 10s
            env:
              - name: CLUSTER_NAME
                value: ($clusterName)
            content: |
              cluster_id=$(kubectl get exoscalecluster "$CLUSTER_NAME" -n default -o jsonpath='{.status.id}')
              description=$(kubectl get exoscalecluster "$CLUSTER_NAME" -n default -o jsonpath='{.status.controlPlaneEndpoint.description}')
              test "$description" = "capi - clusterID - $cluster_id"
        - script:
            timeout: 10s
            env:
              - name: CLUSTER_NAME
                value: ($clusterName)
              - name: API_SERVER_PORT
                value: (to_string($apiServerPort))
            content: |
              start_port=$(kubectl get exoscalecluster "$CLUSTER_NAME" -n default -o jsonpath='{.status.securityGroupControlPlane.rules[?(@.description=="kubernetes API server")].startPort}')
              end_port=$(kubectl get exoscalecluster "$CLUSTER_NAME" -n default -o jsonpath='{.status.securityGroupControlPlane.rules[?(@.description=="kubernetes API server")].endPort}')
              test "$start_port" = "$API_SERVER_PORT"
              test "$end_port" = "$API_SERVER_PORT"

    - name: assert capi endpoint
      try:
        - script:
            timeout: 10s
            env:
              - name: CLUSTER_NAME
                value: ($clusterName)
            content: |
              kubectl get exoscalecluster "$CLUSTER_NAME" -n default \
                -o jsonpath='{.spec.controlPlaneEndpoint.host} {.spec.controlPlaneEndpoint.port}'
            outputs:
              - name: cpHost
                value: (split($stdout, ' ')[0])
              - name: cpPort
                value: (split($stdout, ' ')[1])
        - assert:
            timeout: 10s
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Cluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              (spec.controlPlaneEndpoint.host == $cpHost): true
              (to_string(spec.controlPlaneEndpoint.port) == $cpPort): true
