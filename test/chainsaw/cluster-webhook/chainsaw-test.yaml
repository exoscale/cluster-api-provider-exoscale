# Verifies that the ExoscaleCluster webhooks assign spec.clusterID on creation and
# rejects invalid spec changes on both creation and update.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster-webhook-validation
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  bindings:
    - name: clusterName
      value: (join('-', ['capi-cluster-webhook', ($values.suffix || 'local')]))
    - name: invalidClusterName
      value: (join('-', ['capi-cluster-webhook-invalid', ($values.suffix || 'local')]))
    - name: namespace
      value: default
  steps:
    - name: create valid cluster
      try:
        - apply:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              spec:
                zone: bg-sof-1
            # Checked on the object the API server returns, so a clusterID here was assigned
            # by the defaulting webhook at admission rather than by the controller on a later
            # reconciliation.
            expect:
              - match:
                  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
                  kind: ExoscaleCluster
                check:
                  (regex_match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', spec.clusterID)): true

    - name: reject controlPlaneEndpoint host on create
      try:
        - apply:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              metadata:
                name: ($invalidClusterName)
                namespace: ($namespace)
              spec:
                zone: bg-sof-1
                controlPlaneEndpoint:
                  host: 10.0.0.1
            expect:
              - match:
                  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
                  kind: ExoscaleCluster
                check:
                  ($error != null): true
                  (contains($error, 'must be empty')): true

    - name: reject zone change on update
      try:
        - patch:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              spec:
                zone: ch-gva-2   # trying to change the zone
            expect:
              - match:
                  apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
                  kind: ExoscaleCluster
                check:
                  ($error != null): true
                  (contains($error, 'zone cannot be changed once set')): true

    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              name: ($clusterName)
              namespace: ($namespace)
