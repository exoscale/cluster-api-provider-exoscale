apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleMachineTemplate
metadata:
  name: ($workersName)
  namespace: ($namespace)
spec:
  template:
    spec:
      template: ($template)
      instanceType: ($workerInstanceType)
      rootVolumeSizeGiB: 50
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: K0sWorkerConfigTemplate
metadata:
  name: ($workersName)
  namespace: ($namespace)
spec:
  template:
    spec:
      version: ($k0sVersion)
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ($workersName)
  namespace: ($namespace)
spec:
  clusterName: ($clusterName)
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ($clusterName)
      pool: worker-pool-1
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ($clusterName)
        pool: worker-pool-1
    spec:
      clusterName: ($clusterName)
      version: ($k0sKubeletVersion)
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: K0sWorkerConfigTemplate
          name: ($workersName)
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ExoscaleMachineTemplate
        name: ($workersName)
