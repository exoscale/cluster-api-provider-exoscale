all: false
dir: '{{.InterfaceDir}}/../mocks'
structname: '{{.InterfaceName}}'
filename: '{{.InterfaceName | snakecase}}.go'
pkgname: mocks
template: testify
force-file-write: true

formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
recursive: false
require-template-schema-exists: true
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/exoscale/cluster-api-provider-exoscale/internal/domain:
    interfaces:
      ExoscaleClient:
      Cloud:
      ElasticIPService:
      SecurityGroupService:
      ClusterService:
      InstanceService:
  github.com/exoscale/cluster-api-provider-exoscale/internal/infrastructure/exoscale:
    config:
      dir: '{{.InterfaceDir}}/../../mocks'
    interfaces:
      instanceClient:
        config:
          structname: InstanceClient
          filename: instance_client.go
  github.com/exoscale/cluster-api-provider-exoscale/internal/service:
    interfaces:
      instanceCloud:
        config:
          structname: InstanceCloud
          filename: instance_cloud.go
