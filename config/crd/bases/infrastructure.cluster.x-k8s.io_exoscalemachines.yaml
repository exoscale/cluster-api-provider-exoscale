---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: exoscalemachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: ExoscaleMachine
    listKind: ExoscaleMachineList
    plural: exoscalemachines
    shortNames:
    - exom
    singular: exoscalemachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      type: string
    - jsonPath: .metadata.ownerReferences[?(@.kind=="Machine")].name
      name: Machine
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ExoscaleMachine is the Schema for the exoscalemachines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ExoscaleMachineSpec defines the desired state of an Exoscale compute instance
              backing a Cluster API Machine.
              Zone is inherited from ExoscaleCluster.spec.zone. If multi-zone support is
              added later, use CAPI Machine.spec.failureDomain to pick the target zone
              instead of duplicating zone here.
            properties:
              instanceType:
                description: |-
                  instanceType is an Exoscale instance type UUID or a value in [family.]size
                  format. For example, "small" is shorthand for "standard.small".
                  The value is resolved against the Exoscale catalog during reconciliation.
                  Run `exo compute instance-type list -v` to list available values.
                minLength: 1
                type: string
              providerID:
                description: |-
                  providerID is the cloud-provider identifier for this instance in the form
                  exoscale://<instance-uuid>. Set by the controller after the instance is created.
                  CAPI uses this field to match the InfraMachine to the Node object.
                type: string
              rootVolumeSizeGB:
                description: |-
                  rootVolumeSizeGB is the legacy spelling of rootVolumeSizeGiB.
                  Deprecated: use rootVolumeSizeGiB.
                format: int64
                maximum: 10000
                minimum: 10
                type: integer
              rootVolumeSizeGiB:
                description: rootVolumeSizeGiB overrides the disk size declared by
                  the template.
                format: int64
                maximum: 10000
                minimum: 10
                type: integer
              securityGroups:
                description: |-
                  securityGroups lists UUIDs of Exoscale Security Groups to attach in addition
                  to the cluster's control-plane or node security group.
                items:
                  type: string
                type: array
              sshKey:
                description: sshKey is the name of a pre-existing SSH key registered
                  in the Exoscale project.
                type: string
              template:
                description: |-
                  template is an Exoscale instance template UUID or exact template name.
                  UUIDs pin an exact template; names are resolved at create time.
                minLength: 1
                type: string
              templateID:
                description: |-
                  templateID is the legacy UUID-only spelling of template.
                  Deprecated: use template.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
            required:
            - instanceType
            type: object
            x-kubernetes-validations:
            - message: exactly one of template or templateID must be set
              rule: has(self.template) != has(self.templateID)
            - message: rootVolumeSizeGiB and rootVolumeSizeGB are mutually exclusive
              rule: '!(has(self.rootVolumeSizeGiB) && has(self.rootVolumeSizeGB))'
            - message: instance creation fields are immutable
              rule: '(has(self.template) ? self.template : self.templateID) == (has(oldSelf.template)
                ? oldSelf.template : oldSelf.templateID) && self.instanceType == oldSelf.instanceType
                && has(self.sshKey) == has(oldSelf.sshKey) && (!has(self.sshKey) ||
                self.sshKey == oldSelf.sshKey) && has(self.securityGroups) == has(oldSelf.securityGroups)
                && (!has(self.securityGroups) || self.securityGroups == oldSelf.securityGroups)
                && (has(self.rootVolumeSizeGiB) ? self.rootVolumeSizeGiB : (has(self.rootVolumeSizeGB)
                ? self.rootVolumeSizeGB : 0)) == (has(oldSelf.rootVolumeSizeGiB) ?
                oldSelf.rootVolumeSizeGiB : (has(oldSelf.rootVolumeSizeGB) ? oldSelf.rootVolumeSizeGB
                : 0))'
          status:
            description: |-
              ExoscaleMachineStatus defines the observed state of an ExoscaleMachine.
              Fields follow the CAPI InfraMachine contract:
              https://cluster-api.sigs.k8s.io/developer/providers/contracts/infra-machine
            properties:
              addresses:
                description: addresses are the network addresses of the instance (public
                  and private IPs).
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: conditions represents the observations of the current
                  state of the ExoscaleMachine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureMessage:
                description: failureMessage is a human-readable elaboration of failureReason.
                type: string
              failureReason:
                description: failureReason is a short machine-readable token set on
                  terminal errors.
                type: string
              initialization:
                description: initialization provides observations of the Machine infrastructure
                  initialization process.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true when the infrastructure provider reports that the Machine's infrastructure is fully provisioned.
                      NOTE: this field is part of the Cluster API contract, and it is used to orchestrate Machine provisioning.
                      see: https://cluster-api.sigs.k8s.io/developer/providers/contracts/infra-machine#inframachine-initialization-completed
                    type: boolean
                type: object
              instanceID:
                description: instanceID is the Exoscale instance UUID assigned after
                  creation.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              ready:
                description: ready is true when the Exoscale instance is running and
                  reachable.
                type: boolean
            required:
            - ready
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
