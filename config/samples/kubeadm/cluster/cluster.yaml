apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleCluster
metadata:
  name: my-cluster
  namespace: default
spec:
  zone: ch-gva-2
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: my-cluster
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: my-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ExoscaleCluster
    name: my-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleMachineTemplate
metadata:
  name: my-control-plane
  namespace: default
spec:
  template:
    spec:
      template: Linux Ubuntu 24.04 LTS 64-bit
      instanceType: small
      rootVolumeSizeGiB: 20
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: my-control-plane
  namespace: default
spec:
  replicas: 1
  version: v1.32.13
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ExoscaleMachineTemplate
        name: my-control-plane
  kubeadmConfigSpec:
    format: cloud-config
    initConfiguration:
      nodeRegistration:
        taints: []
    preKubeadmCommands:
      - |
        set -eux
        swapoff -a

        cat >/etc/modules-load.d/kubernetes.conf <<EOF
        overlay
        br_netfilter
        EOF
        modprobe overlay
        modprobe br_netfilter

        cat >/etc/sysctl.d/99-kubernetes.conf <<EOF
        net.bridge.bridge-nf-call-iptables = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward = 1
        EOF
        sysctl --system

        apt-get update
        apt-get install -y ca-certificates curl gpg containerd

        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key \
          | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /' \
          >/etc/apt/sources.list.d/kubernetes.list

        apt-get update
        apt-get install -y \
          kubeadm=1.32.13-1.1 \
          kubelet=1.32.13-1.1 \
          kubectl=1.32.13-1.1
        apt-mark hold kubeadm kubelet kubectl

        mkdir -p /etc/containerd
        containerd config default >/etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        echo "KUBELET_EXTRA_ARGS=--provider-id=exoscale://$(cat /var/lib/cloud/data/instance-id)" \
          >/etc/default/kubelet
        systemctl enable --now containerd
        systemctl enable kubelet
    postKubeadmCommands:
      - kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f https://github.com/flannel-io/flannel/releases/download/v0.28.8/kube-flannel.yml
