# This NetworkPolicy allows admission traffic to the webhook server running
# as part of the controller-manager.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: cluster-api-provider-exoscale
    app.kubernetes.io/managed-by: kustomize
  name: allow-webhook-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cluster-api-provider-exoscale
  policyTypes:
    - Ingress
  ingress:
    # The webhook server listens on containerPort 9443 (see
    # config/default/manager_webhook_patch.yaml). kube-apiserver reaches it
    # via the Service named webhook-service, which targets 9443.
    # Allow admission traffic regardless of whether the API server runs as a
    # pod, on a node, or outside the workload cluster.
    - ports:
      - port: 9443
        protocol: TCP
