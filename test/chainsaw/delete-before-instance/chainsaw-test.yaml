# verifies deletion does not get stuck
# if reconcile failed before creating a VM.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: delete-before-instance
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  bindings:
    - name: zone
      value: ($values.zone || 'bg-sof-1')
    - name: clusterName
      value: (join('-', ['exo-dbi', ($values.suffix || 'local')]))
    - name: machineName
      value: (join('-', ['machine-delete-before-instance', ($values.suffix || 'local')]))
    - name: bootstrapSecretName
      value: (join('-', ['bootstrap-delete-before-instance', ($values.suffix || 'local')]))
    - name: namespace
      value: default
  steps:
    - name: apply cluster
      try:
        - apply:
            file: cluster.yaml

    - name: mark cluster infrastructure ready
      try:
        - patch:
            subresource: status
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              status:
                securityGroupNode:
                  id: 00000000-0000-0000-0000-000000000001
        - patch:
            subresource: status
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Cluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              status:
                initialization:
                  infrastructureProvisioned: true
        - assert:
            timeout: 2m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              status:
                conditions:
                  - type: Paused
                    reason: Paused
                    status: "True"
                securityGroupNode:
                  id: 00000000-0000-0000-0000-000000000001
        - assert:
            timeout: 2m
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Cluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              status:
                initialization:
                  infrastructureProvisioned: true

    - name: apply machine with invalid security group
      try:
        - apply:
            file: machine.yaml
            outputs:
              - name: machine
                match:
                  apiVersion: cluster.x-k8s.io/v1beta2
                  kind: Machine
                  metadata:
                    name: ($machineName)
                value: (@)
        - apply:
            file: exoscalemachine.yaml

    - name: assert stopped before instance upsert
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
                finalizers:
                  - exoscalemachine.infrastructure.cluster.x-k8s.io
              spec:
                (providerID == null): true
              status:
                ready: false
                conditions:
                  - type: Ready
                    reason: InternalError
                    status: "False"
                    (contains(message, 'invalid ExoscaleMachine security group ID "not-a-uuid"')): true
                (instanceID == null): true

    - name: delete before instance exists
      try:
        - delete:
            timeout: 2m
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              name: ($machineName)
              namespace: ($namespace)
