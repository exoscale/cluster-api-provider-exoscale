apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleCluster
metadata:
  name: ($clusterName)
  namespace: ($namespace)
spec:
  zone: ($zone)
  securityGroupControlPlane:
    rules:
      - flowDirection: ingress
        protocol: udp
        startPort: 8472
        endPort: 8472
        securityGroup: itself
        description: Flannel VXLAN between control-plane nodes
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ($clusterName)
  namespace: ($namespace)
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ($clusterName)
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ExoscaleCluster
    name: ($clusterName)
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleMachineTemplate
metadata:
  name: ($clusterName)
  namespace: ($namespace)
spec:
  template:
    metadata:
      labels:
        e2e.cluster.x-k8s.io/template: ($clusterName)
      annotations:
        e2e.cluster.x-k8s.io/template: ($clusterName)
    spec:
      template: ($template)
      instanceType: ($instanceType)
      rootVolumeSizeGiB: 20
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: ($clusterName)
  namespace: ($namespace)
spec:
  replicas: 1
  version: v1.32.13
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ExoscaleMachineTemplate
        name: ($clusterName)
  kubeadmConfigSpec:
    format: cloud-config
    initConfiguration:
      nodeRegistration:
        criSocket: unix:///run/containerd/containerd.sock
        taints: []
    files:
      - path: /etc/modules-load.d/k8s.conf
        owner: root:root
        permissions: "0644"
        content: |
          overlay
          br_netfilter
      - path: /etc/sysctl.d/99-kubernetes-cri.conf
        owner: root:root
        permissions: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
    preKubeadmCommands:
      - swapoff -a
      - sed -ri '/\sswap\s/s/^#?/#/' /etc/fstab
      - modprobe overlay
      - modprobe br_netfilter
      - sysctl --system
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gpg containerd
      - mkdir -p /etc/containerd
      - containerd config default > /etc/containerd/config.toml
      - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      - systemctl enable --now containerd
      - install -m 0755 -d /etc/apt/keyrings
      - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      - printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y kubelet=1.32.13-1.1 kubeadm=1.32.13-1.1
      - apt-mark hold kubelet kubeadm
      - >-
        instance_id="$(curl --fail --silent --show-error --retry 30 --retry-delay 2
        http://metadata.exoscale.com/latest/meta-data/instance-id | tr -d '\r\n')";
        test -n "$instance_id";
        printf 'KUBELET_EXTRA_ARGS=--provider-id=exoscale://%s\n' "$instance_id" > /etc/default/kubelet
      - systemctl enable kubelet
