name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Check custom image acceptance
        run: |
          bash -n hack/render-kubeadm-sample.sh
          bash -n hack/run-custom-image-acceptance.sh
          bash -n hack/cleanup-custom-image-acceptance.sh
          message=$(./hack/run-custom-image-acceptance.sh 2>&1) && exit 1
          if [[ "$message" != "CUSTOM_IMAGE_TEMPLATE and an exact v-prefixed CUSTOM_IMAGE_KUBERNETES_VERSION are required together." ]]; then
            exit 1
          fi
          message=$(ACCEPTANCE_MARKER=/tmp/missing-acceptance-marker ./hack/cleanup-custom-image-acceptance.sh 2>&1) && exit 1
          if [[ "$message" != "Refusing cleanup without an acceptance marker for Kind cluster capi-sample." ]]; then
            exit 1
          fi

          make kustomize yq
          export CUSTOM_IMAGE_TEMPLATE=test-template
          export CUSTOM_IMAGE_KUBERNETES_VERSION=v1.36.4
          bash hack/render-kubeadm-sample.sh config/samples/kubeadm/cluster-custom-image \
            >/tmp/rendered-custom-image.yaml
          test "$(bin/yq eval-all '[.] | map(select(.kind != null)) | length' /tmp/rendered-custom-image.yaml)" -eq 4
          test "$(bin/yq eval-all 'select(.kind == "ExoscaleMachineTemplate") | .spec.template.spec.template' /tmp/rendered-custom-image.yaml)" = test-template
          test "$(bin/yq eval-all 'select(.kind == "KubeadmControlPlane") | .spec.version' /tmp/rendered-custom-image.yaml)" = v1.36.4
