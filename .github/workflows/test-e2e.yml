name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  detect-noop:
    runs-on: ubuntu-24.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  chainsaw:
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      # Skip delete in order to create an artifact with all the information
      # necessary for an investigation on failure.
      #
      # Each tests must delete its cluster at the end of its test case in order
      # to prevent unnecessary clean or infromation during an investigation.
      - name: Run Chainsaw
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHAINSAW_MACHINE_TEMPLATE: Linux Ubuntu 24.04 LTS 64-bit
          EXOSCALE_API_KEY: ${{ secrets.EXOSCALE_API_KEY }}
          EXOSCALE_API_SECRET: ${{ secrets.EXOSCALE_API_SECRET }}
        run: |
          make chainsaw-test-e2e \
            CHAINSAW_VALUES_SUFFIX=${COMMIT_SHA::8} \
            CHAINSAW_SKIP_DELETE=1

      # On failure dump the logs and resource into a artifact for further investigation.
      - name: Dump management cluster diagnostics
        if: failure()
        run: ./hack/dump-e2e-diagnostics.sh e2e-diagnostics

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics
          if-no-files-found: warn
          retention-days: 5

      # chainsaw runs with --skip-delete: on a green run each test already deleted
      # its own resources; on a failed run the failing test skipped its cleanup.
      # The diagnostics dump above has already captured everything, so here we just
      # force-delete whatever is left (Clusters first so the provider reaps cloud
      # resources through owner refs, then any bare infra objects) and verify the
      # result. Anything still present afterwards means a delete genuinely failed
      # (e.g. a stuck finalizer) — fail the step so leaked Exoscale VMs/EIP/SGs
      # never go unnoticed.
      - name: Teardown workload clusters
        if: always()
        run: |
          kubectl delete clusters.cluster.x-k8s.io -A --all --ignore-not-found --wait --timeout=20m || true
          kubectl delete exoscaleclusters.infrastructure.cluster.x-k8s.io -A --all --ignore-not-found --wait --timeout=20m || true
          kubectl delete exoscalemachines.infrastructure.cluster.x-k8s.io -A --all --ignore-not-found --wait --timeout=20m || true

          leftover=$(kubectl get exoscaleclusters,exoscalemachines -A --no-headers 2>/dev/null | wc -l)
          if [ "$leftover" -ne 0 ]; then
            echo "::error::teardown incomplete: $leftover infra resource(s) still present — likely leaked Exoscale VMs/EIP/SGs, clean up manually"
            kubectl get exoscaleclusters,exoscalemachines -A
            exit 1
          fi
          echo "Teardown complete: no infra resources remaining."
