name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/exoscale/cluster-api-provider-exoscale:${{ github.ref_name }}
    steps:
      - name: Validate tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate and validate release assets
        shell: bash
        run: |
          make manifests generate
          git diff --exit-code
          make release IMG="$IMAGE"
          make yq clusterctl

          expected="$(printf '%s\n' cluster-template-custom-image.yaml cluster-template.yaml infrastructure-components.yaml metadata.yaml)"
          actual="$(for file in out/*; do basename "$file"; done | sort)"
          test "$actual" = "$expected"

          for file in out/*.yaml; do
            bin/yq eval-all 'true' "$file" >/dev/null
          done
          test "$(bin/yq '.apiVersion' out/metadata.yaml)" = clusterctl.cluster.x-k8s.io/v1alpha3
          test "$(bin/yq '.kind' out/metadata.yaml)" = Metadata
          test "$(bin/yq '.releaseSeries | length' out/metadata.yaml)" -eq 1
          test "$(bin/yq '.releaseSeries[0].major' out/metadata.yaml)" -eq 0
          test "$(bin/yq '.releaseSeries[0].minor' out/metadata.yaml)" -eq 1
          test "$(bin/yq '.releaseSeries[0].contract' out/metadata.yaml)" = v1beta2
          test "$(bin/yq 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "manager") | .image' out/infrastructure-components.yaml)" = "$IMAGE"
          if grep -q 'controller:latest' out/*.yaml; then exit 1; fi
          test -z "$(bin/yq eval-all 'select(.kind != null and .metadata.labels."cluster.x-k8s.io/provider" != "infrastructure-exoscale") | .kind' out/infrastructure-components.yaml)"
          test "$(bin/yq eval-all 'select(.kind == "Namespace") | .kind' out/infrastructure-components.yaml | wc -l)" -eq 1

          unresolved_pattern='[$][{][A-Z][A-Z0-9_]*(:=[^}]*)?[}]'
          EXOSCALE_ZONE=ch-gva-2 bin/clusterctl generate cluster release-validation \
            --from out/cluster-template.yaml \
            --kubernetes-version v1.32.13 \
            --worker-machine-count 2 \
            --target-namespace default > /tmp/rendered-cluster.yaml
          bin/yq eval-all 'true' /tmp/rendered-cluster.yaml >/dev/null
          test -z "$(bin/yq eval-all 'select(.metadata.namespace != "default") | .kind' /tmp/rendered-cluster.yaml)"
          if grep -Eq "$unresolved_pattern" /tmp/rendered-cluster.yaml; then exit 1; fi
          test "$(bin/yq eval-all 'select(.kind == "MachineDeployment") | .spec.replicas' /tmp/rendered-cluster.yaml)" -eq 2
          test "$(bin/yq eval-all 'select(.kind == "MachineDeployment") | .spec.template.spec.version' /tmp/rendered-cluster.yaml)" = v1.32.13

          EXOSCALE_ZONE=ch-gva-2 EXOSCALE_TEMPLATE=00000000-0000-0000-0000-000000000000 \
            bin/clusterctl generate cluster release-validation \
            --from out/cluster-template-custom-image.yaml \
            --kubernetes-version v1.36.4 \
            --worker-machine-count 2 \
            --target-namespace default > /tmp/rendered-custom-image-cluster.yaml
          bin/yq eval-all 'true' /tmp/rendered-custom-image-cluster.yaml >/dev/null
          test -z "$(bin/yq eval-all 'select(.metadata.namespace != "default") | .kind' /tmp/rendered-custom-image-cluster.yaml)"
          if grep -Eq "$unresolved_pattern" /tmp/rendered-custom-image-cluster.yaml; then exit 1; fi
          test "$(bin/yq eval-all '[select(.kind == "ExoscaleMachineTemplate")] | length' /tmp/rendered-custom-image-cluster.yaml)" -eq 2
          test "$(bin/yq eval-all '[select(.kind == "ExoscaleMachineTemplate") | .spec.template.spec.template] | unique | .[]' /tmp/rendered-custom-image-cluster.yaml)" = 00000000-0000-0000-0000-000000000000
          test "$(bin/yq eval-all 'select(.kind == "KubeadmControlPlane") | .spec.version' /tmp/rendered-custom-image-cluster.yaml)" = v1.36.4
          test "$(bin/yq eval-all 'select(.kind == "KubeadmControlPlane") | .spec.kubeadmConfigSpec.preKubeadmCommands | length' /tmp/rendered-custom-image-cluster.yaml)" -eq 1
          test "$(bin/yq eval-all 'select(.kind == "MachineDeployment") | .spec.replicas' /tmp/rendered-custom-image-cluster.yaml)" -eq 2
          test "$(bin/yq eval-all 'select(.kind == "MachineDeployment") | .spec.template.spec.version' /tmp/rendered-custom-image-cluster.yaml)" = v1.36.4
          test "$(bin/yq eval-all 'select(.kind == "KubeadmConfigTemplate") | .spec.template.spec.preKubeadmCommands | length' /tmp/rendered-custom-image-cluster.yaml)" -eq 1
          if grep -Eq 'apt-get|pkgs.k8s.io|containerd config' /tmp/rendered-custom-image-cluster.yaml; then exit 1; fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: make docker-buildx IMG="$IMAGE" PLATFORMS=linux/amd64,linux/arm64

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}"
