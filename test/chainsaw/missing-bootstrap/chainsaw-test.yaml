# Verifies that a Machine without bootstrap data records no VM or provider state
# and can still be deleted before an instance exists.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: missing-bootstrap
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  bindings:
    - name: zone
      value: ($values.zone || 'bg-sof-1')
    - name: clusterName
      value: (join('-', ['exo-mb', ($values.suffix || 'local')]))
    - name: machineName
      value: (join('-', ['machine-missing-bootstrap', ($values.suffix || 'local')]))
    - name: namespace
      value: default
  steps:
    - name: apply cluster
      try:
        - apply:
            file: cluster.yaml

    - name: assert cluster paused
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleCluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              status:
                conditions:
                  - type: Paused
                    reason: Paused
                    status: "True"
                (securityGroupWorker == null): true

    - name: mark cluster infrastructure ready
      try:
        - patch:
            subresource: status
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Cluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              status:
                initialization:
                  infrastructureProvisioned: true
        - assert:
            timeout: 2m
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Cluster
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              status:
                initialization:
                  infrastructureProvisioned: true

    - name: apply machine without bootstrap data
      try:
        - apply:
            file: machine.yaml
            outputs:
              - name: machine
                match:
                  apiVersion: cluster.x-k8s.io/v1beta2
                  kind: Machine
                  metadata:
                    name: ($machineName)
                value: (@)
        - apply:
            file: exoscalemachine.yaml

    - name: assert no instance is created
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                name: ($machineName)
                namespace: ($namespace)
                finalizers:
                  - exoscalemachine.infrastructure.cluster.x-k8s.io
              (spec.providerID == null): true
              (status.instanceID == null): true
              (status.ready != `true`): true

    - name: delete machine without instance
      try:
        - delete:
            timeout: 2m
            ref:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Machine
              name: ($machineName)
              namespace: ($namespace)
