apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleCluster
metadata:
  name: ($clusterName)
  namespace: ($namespace)
spec:
  zone: ($zone)
  securityGroupControlPlane:
    rules:
      - description: allow ssh
        network: "0.0.0.0/0"
        endPort: 22
        startPort: 22
        protocol: tcp
        flowDirection: ingress
  securityGroupNode:
    rules:
      - description: allow ssh
        network: "0.0.0.0/0"
        endPort: 22
        startPort: 22
        protocol: tcp
        flowDirection: ingress
