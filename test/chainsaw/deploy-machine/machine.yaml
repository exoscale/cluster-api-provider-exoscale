apiVersion: v1
kind: Secret
metadata:
  name: ($bootstrapSecretName)
  namespace: ($namespace)
type: Opaque
stringData:
  value: |
    #cloud-config
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Machine
metadata:
  name: ($machineName)
  namespace: ($namespace)
  labels:
    cluster.x-k8s.io/cluster-name: ($clusterName)
spec:
  clusterName: ($clusterName)
  bootstrap:
    dataSecretName: ($bootstrapSecretName)
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ExoscaleMachine
    name: ($machineName)
