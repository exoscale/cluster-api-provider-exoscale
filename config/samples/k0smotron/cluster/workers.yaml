apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ExoscaleMachineTemplate
metadata:
  name: my-k0s-cluster-workers
  namespace: default
spec:
  template:
    spec:
      template: "Linux Ubuntu 24.04 LTS 64-bit"
      instanceType: standard.small
      rootVolumeSizeGiB: 50
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: K0sWorkerConfigTemplate
metadata:
  name: my-k0s-cluster-workers
  namespace: default
spec:
  template:
    spec:
      version: v1.36.3+k0s.0
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: my-k0s-cluster-workers
  namespace: default
spec:
  clusterName: my-k0s-cluster
  # Starts at 1 worker; the README's "Scale the worker nodes" section grows
  # this to 3.
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: my-k0s-cluster
      pool: worker-pool-1
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: my-k0s-cluster
        pool: worker-pool-1
    spec:
      clusterName: my-k0s-cluster
      # Must match Node.status.nodeInfo.kubeletVersion exactly — CAPI >= v1.14
      # compares these as raw strings (machine_controller_status.go:726).
      # k0s reports "+k0s" while its release tag is "+k0s.0".
      version: v1.36.3+k0s
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: K0sWorkerConfigTemplate
          name: my-k0s-cluster-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ExoscaleMachineTemplate
        name: my-k0s-cluster-workers
