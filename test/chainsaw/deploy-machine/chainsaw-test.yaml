# verifies KubeadmControlPlane clones an ExoscaleMachineTemplate and CAPX
# provisions the generated ExoscaleMachine and real VM.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deploy-machine-template
spec:
  concurrent: false
  timeouts:
    delete: 10m
    cleanup: 10m
  bindings:
    - name: zone
      value: ($values.zone || 'bg-sof-1')
    - name: clusterName
      value: (join('-', ['exo-dm', ($values.suffix || 'local')]))
    - name: namespace
      value: default
    - name: template
      value: ($values.template)
    - name: instanceType
      value: ($values.instanceType || 'small')
  steps:
    - name: apply cluster and control plane
      try:
        - apply:
            file: cluster.yaml

    - name: assert machine template is referenced
      try:
        - assert:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachineTemplate
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              spec:
                template:
                  metadata:
                    labels:
                      e2e.cluster.x-k8s.io/template: ($clusterName)
                  spec:
                    template: ($template)
                    instanceType: ($instanceType)
                    (sshKey == null): true
        - assert:
            resource:
              apiVersion: controlplane.cluster.x-k8s.io/v1beta2
              kind: KubeadmControlPlane
              metadata:
                name: ($clusterName)
                namespace: ($namespace)
              spec:
                machineTemplate:
                  spec:
                    infrastructureRef:
                      apiGroup: infrastructure.cluster.x-k8s.io
                      kind: ExoscaleMachineTemplate
                      name: ($clusterName)

    - name: assert CAPI generated machine resources
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
              kind: KubeadmConfig
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
                  cluster.x-k8s.io/control-plane: ""
              status:
                initialization:
                  dataSecretCreated: true
                (dataSecretName != ''): true
        - assert:
            timeout: 2m
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Machine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
                  cluster.x-k8s.io/control-plane: ""
              spec:
                bootstrap:
                  (dataSecretName != ''): true
                infrastructureRef:
                  apiGroup: infrastructure.cluster.x-k8s.io
                  kind: ExoscaleMachine

    - name: assert generated machine ready
      try:
        - assert:
            timeout: 10m
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
                  e2e.cluster.x-k8s.io/template: ($clusterName)
              spec:
                template: ($template)
                instanceType: ($instanceType)
                (sshKey == null): true
              status:
                initialization:
                  provisioned: true
                ready: true
                conditions:
                  - type: Ready
                    reason: Ready
                    status: "True"
                instanceState: running
                addresses:
                  - type: ExternalIP
                    (address != ''): true
        - assert:
            resource:
              apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
              kind: ExoscaleMachine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
                  e2e.cluster.x-k8s.io/template: ($clusterName)
              (spec.providerID == join('', ['exoscale://', status.instanceID])): true
              status:
                (regex_match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', instanceID)): true

    - name: assert CAPI machine registered infrastructure
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: cluster.x-k8s.io/v1beta2
              kind: Machine
              metadata:
                namespace: ($namespace)
                labels:
                  cluster.x-k8s.io/cluster-name: ($clusterName)
                  cluster.x-k8s.io/control-plane: ""
              spec:
                (providerID != ''): true
              status:
                initialization:
                  infrastructureProvisioned: true
                addresses:
                  - type: ExternalIP
                    (address != ''): true

    - name: delete control plane
      try:
        - delete:
            timeout: 10m
            ref:
              apiVersion: controlplane.cluster.x-k8s.io/v1beta2
              kind: KubeadmControlPlane
              name: ($clusterName)
              namespace: ($namespace)
